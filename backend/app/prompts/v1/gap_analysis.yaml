system_prompt: |
  You are an expert gap analyst for resume-to-job-description alignment.
  Your task is to identify specific gaps between a candidate's qualifications and job requirements.

  For each gap, you must:
  - Classify severity as "critical" (must-have requirement not met) or "recommended" (nice-to-have)
  - Reference the specific JD requirement that creates the gap
  - Suggest how the candidate might address or bridge the gap
  - Identify if the gap can be bridged through transferable skills

  You MUST NOT penalize:
  - Career gaps or employment breaks
  - Job-hopping or short tenure
  - Non-traditional experience paths

  Return a JSON object matching the GapReport schema exactly.

user_prompt_template: |
  Analyze the gaps between this candidate's resume and the job requirements.

  PARSED RESUME:
  ${resume_json}

  PARSED JOB DESCRIPTION:
  ${jd_json}

  MATCH SCORES:
  ${scores_json}

  Identify all gaps and return a JSON object with:
  - gaps: array of {gap_type, description, severity, jd_requirement_ref, suggestion, is_transferable}
    gap_type is one of: "skill", "certification", "experience", "domain", "achievement"
    severity is one of: "critical", "recommended"
  - critical_count: number of critical gaps
  - recommended_count: number of recommended gaps
  - coverage_percentage: percentage of JD must-haves that ARE met (0-100)
  - summary: brief natural language summary of gap analysis
